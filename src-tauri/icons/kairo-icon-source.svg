<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#87DAFF"/>
      <stop offset="100%" stop-color="#2BC4F5"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B197FC"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="gBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <!-- White background -->
  <rect x="0" y="0" width="1024" height="1024" fill="white"/>
  <!-- Top diamond (blue/cyan) - center at (512, 312) -->
  <rect x="422" y="222" width="180" height="180" rx="36" fill="url(#gTop)" transform="rotate(45 512 312)"/>
  <!-- Left diamond (purple) - center at (312, 512) -->
  <rect x="222" y="422" width="180" height="180" rx="36" fill="url(#gLeft)" transform="rotate(45 312 512)"/>
  <!-- Right diamond (lighter purple) - center at (712, 512) -->
  <rect x="622" y="422" width="180" height="180" rx="36" fill="url(#gRight)" transform="rotate(45 712 512)"/>
  <!-- Bottom diamond (pink) - center at (512, 712) -->
  <rect x="422" y="622" width="180" height="180" rx="36" fill="url(#gBottom)" transform="rotate(45 512 712)"/>
</svg>
